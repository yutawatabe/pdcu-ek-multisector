[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ek-model"
version = "0.1.0"
description = "One-industry Eaton-Kortum PDCU teaching model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ek_model"]
